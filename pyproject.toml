[project]
name = "prl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Osman Sahin Guler", email = "osmansahinguler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

# PRL is an application run from the repo (make run), not an installable library.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C901", "ANN"]
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "tests/golden/.jsonl"
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 5
